[build]
  base = ""
  publish = "dist"
  command = "npm run build"
  functions = "functions"

[build.environment]
  NODE_VERSION = "20"

# Legacy rollback adapter. The existing production deployment is untouched.
# Replacement source posts JSON to /api/contact; on a rollback Netlify build,
# this redirect invokes the retained thin adapter using the shared core.
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Canonical hostname retained for rollback compatibility.
[[redirects]]
  from = "https://www.2sbusinesssupport.com/*"
  to = "https://2sbusinesssupport.com/:splat"
  status = 301
  force = true

# This is a multi-page static site; do not add an SPA catch-all redirect.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    X-Frame-Options = "DENY"
